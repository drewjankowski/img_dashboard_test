name: Update stats

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas lxml
      - run: python scraper/scrape.py
      - name: Save new stats
        run: |
          git config user.name "stats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/2026-27.json
          if git diff --cached --quiet; then
            echo "No new games."
          else
            git commit -m "Update 2026-27 stats"
            git push
          fi
