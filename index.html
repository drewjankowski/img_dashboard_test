<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Performance Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #003da5 0%, #002d7a 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.3em;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        
        .header .subtitle {
            font-size: 1.3em;
            font-weight: 600;
            opacity: 0.95;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1em;
            opacity: 0.85;
            font-weight: 400;
        }
        
        .dashboard {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .player-table-section {
            margin-bottom: 40px;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .table-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #2d3748;
        }
        
        .view-toggles {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .view-btn {
            padding: 10px 20px;
            border: 2px solid #003da5;
            background: white;
            color: #003da5;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .view-btn:hover {
            background: #003da5;
            color: white;
        }
        
        .view-btn.active {
            background: #003da5;
            color: white;
        }
        
        .player-table-container {
            overflow-x: auto;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }
        
        .player-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            min-width: 800px;
        }
        
        .player-table th:first-child,
        .player-table td:first-child {
            width: 200px;
            min-width: 200px;
        }
        
        .player-table th {
            background: linear-gradient(135deg, #003da5 0%, #002d7a 100%);
            color: white;
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .player-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9em;
        }
        
        .player-table tr:last-child td {
            border-bottom: none;
        }
        
        .player-table tr:hover {
            background: #f7fafc;
        }
        
        .player-photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #003da5;
        }
        
        .player-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .player-name {
            font-weight: 600;
            color: #2d3748;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .player-name:hover {
            color: #0055d4;
            text-decoration: underline;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #003da5 0%, #002d7a 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .stat-card .player-photo-small {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            margin-bottom: 15px;
        }
        
        .stat-card h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: 700;
        }
        
        .stat-card .label {
            font-size: 0.85em;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .chart-container {
            margin-bottom: 40px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
        }
        
        .chart-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2d3748;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #003da5;
            font-size: 1.2em;
        }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #003da5;
            background: white;
            color: #003da5;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            background: #003da5;
            color: white;
        }
        
        .filter-btn.active {
            background: #003da5;
            color: white;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }
        
        .modal-content {
            background-color: white;
            margin: 2% auto;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 1400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #003da5;
        }
        
        .modal-player-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .modal-player-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #003da5;
        }
        
        .modal-player-name {
            font-size: 2em;
            font-weight: 700;
            color: #2d3748;
        }
        
        .close-btn {
            background: #003da5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .close-btn:hover {
            background: #002d7a;
            transform: scale(1.05);
        }
        
        .game-log-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .game-log-table th {
            background: linear-gradient(135deg, #003da5 0%, #002d7a 100%);
            color: white;
            padding: 12px 8px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .game-log-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85em;
            text-align: center;
        }
        
        .game-log-table tr:last-child td {
            border-bottom: none;
        }
        
        .game-log-table tr:hover {
            background: #f7fafc;
        }
        
        .game-number {
            font-weight: 600;
            color: #003da5;
        }
        
        .trend-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        
        .trend-up {
            background: #d4edda;
            color: #155724;
        }
        
        .trend-down {
            background: #f8d7da;
            color: #721c24;
        }
        
        .trend-neutral {
            background: #fff3cd;
            color: #856404;
        }
        
        .recent-stats {
            font-size: 0.9em;
            color: #6c757d;
        }
        .season-bar { display:flex; justify-content:center; gap:10px; margin-bottom:25px; flex-wrap:wrap; }
        .season-bar .view-btn { background:transparent; color:white; border-color:white; }
        .season-bar .view-btn.active, .season-bar .view-btn:hover { background:white; color:#003da5; }
        .hero { text-align:center; padding:10px 0 35px; border-bottom:1px solid #e2e8f0; margin-bottom:35px; }
        .hero .big { font-size:4.5em; font-weight:800; color:#003da5; line-height:1; }
        .hero .caption { font-size:1.1em; color:#4a5568; margin-top:8px; font-weight:600; }
        .hero .subs { display:flex; justify-content:center; gap:40px; margin-top:22px; flex-wrap:wrap; }
        .hero .subs div { font-size:0.85em; color:#718096; text-transform:uppercase; letter-spacing:1px; }
        .hero .subs b { display:block; font-size:1.8em; color:#2d3748; letter-spacing:0; }
        #leaderTable th:first-child, #leaderTable td:first-child { width:50px; min-width:50px; }
        .rank { font-weight:800; color:#003da5; font-size:1.1em; width:40px; }
        .player-team { font-size:0.8em; color:#718096; }
        .empty { padding:30px; text-align:center; color:#718096; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏀 Shannon's Player Performance Dashboard</h1>
            <div class="subtitle">Ex-IMG Lady Basketball Athletes</div>
            <p>College Performance Analytics & Season Tracking</p>
        </div>
        <div class="season-bar" id="seasonBar"></div>
        <div class="dashboard">
            <div id="loading" class="loading">Loading data...</div>
            <div id="error" style="display:none;"></div>
            <div id="content" style="display:none;">
                <div class="hero" id="hero"></div>

                <div class="player-table-section">
                    <div class="table-header"><div class="table-title" id="leaderTitle">Top Scorers</div></div>
                    <div class="player-table-container"><table class="player-table" id="leaderTable"></table></div>
                </div>

                <div class="player-table-section">
                    <div class="table-header">
                        <div class="table-title">Player Statistics</div>
                        <div class="view-toggles">
                            <button class="view-btn active" data-view="totals">Totals</button>
                            <button class="view-btn" data-view="per40">Per 40</button>
                        </div>
                    </div>
                    <div class="player-table-container"><table class="player-table" id="playerTable"></table></div>
                </div>

                <div class="stats-grid" id="statsGrid"></div>

                <div class="player-table-section">
                    <div class="table-header"><div class="table-title">Recent Form - Last 5 Games</div></div>
                    <div class="player-table-container"><table class="player-table" id="recentFormTable"></table></div>
                </div>

                <div class="filters" id="filters">
                    <button class="filter-btn active" data-filter="all">All Players</button>
                    <button class="filter-btn" data-filter="valid">Valid Minutes Only (5+)</button>
                </div>

                <div class="chart-container">
                    <div class="chart-title">Efficiency vs Playing Time</div>
                    <div id="scatterPlot"></div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">Player Performance Comparison</div>
                    <div id="barChart"></div>
                </div>
                <div class="chart-container">
                    <div class="table-header">
                        <div class="chart-title">Season Progression</div>
                        <div class="view-toggles">
                            <button class="view-btn active" data-stat="pts">Points</button>
                            <button class="view-btn" data-stat="trb">Rebounds</button>
                            <button class="view-btn" data-stat="ast">Assists</button>
                        </div>
                    </div>
                    <div id="lineChart"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-player-info">
                    <img id="modalPlayerPhoto" class="modal-player-photo" src="" alt="">
                    <div>
                        <div class="modal-player-name" id="modalPlayerName"></div>
                        <div class="player-team" id="modalPlayerTeam"></div>
                    </div>
                </div>
                <button class="close-btn" onclick="closePlayerModal()">← Back to Dashboard</button>
            </div>
            <div class="player-table-container"><table class="game-log-table" id="gameLogTable"></table></div>
        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script>
        const SEASONS = ['2025-26', '2026-27'];
        const MIN_MP = 5;
        let roster = [], teams = {}, games = [];
        let scope = null, currentFilter = 'all', currentView = 'totals', currentStat = 'pts';

        const r1 = x => Math.round(x * 10) / 10;
        const sum = (arr, k) => arr.reduce((s, g) => s + g[k], 0);
        const player = id => roster.find(p => p.id === id);
        const fullName = id => { const p = player(id); return `${p.first} ${p.last}`; };
        const seasonsDesc = () => [...SEASONS].reverse();

        function teamOf(id, season) {
            const s = player(id).seasons;
            const key = season && s[season] ? season : seasonsDesc().find(x => s[x]);
            return s[key] ? s[key].team : '';
        }

        function photoOf(id, season) {
            const s = player(id).seasons;
            if (season && s[season] && s[season].photo) return s[season].photo;
            const k = seasonsDesc().find(x => s[x] && s[x].photo);
            return k ? s[k].photo : '';
        }

        function enrich(g) {
            g.trb = g.orb + g.drb;
            g.fgPct = g.fga ? g.fg / g.fga : 0;
            g.ptsPerFGA = g.fga ? g.pts / g.fga : 0;
            g.gameScore = g.pts + 1.4 * g.fg - g.fga + 0.7 * g.orb + 0.3 * g.drb + g.ast + g.stl - g.tov;
            return g;
        }

        async function loadData() {
            try {
                roster = await (await fetch('data/roster.json')).json();
                const csv = await (await fetch('data/teams.csv')).text();
                const [head, ...lines] = csv.trim().split(/\r?\n/).map(l => l.split(','));
                lines.forEach(l => { const t = Object.fromEntries(head.map((h, i) => [h, l[i]])); teams[`${t.team}|${t.season}`] = t; });
                const files = await Promise.all(SEASONS.map(s =>
                    fetch(`data/${s}.json`).then(r => r.ok ? r.json() : { games: [] }).catch(() => ({ games: [] }))));
                games = files.flatMap((f, i) => f.games.map(g => enrich({ ...g, season: SEASONS[i] })));
                scope = seasonsDesc().find(s => games.some(g => g.season === s)) || SEASONS[SEASONS.length - 1];
                renderSeasonBar();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderDashboard();
            } catch (e) {
                console.error(e);
                showError('Unable to load the data files.');
            }
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const el = document.getElementById('error');
            el.innerHTML = `<div class="error">${message}</div>`;
            el.style.display = 'block';
        }

        function renderSeasonBar() {
            const opts = [...seasonsDesc().map(s => [s, s]), ['all', 'Career']];
            const bar = document.getElementById('seasonBar');
            bar.innerHTML = opts.map(([v, l]) => `<button class="view-btn${v === scope ? ' active' : ''}" data-scope="${v}">${l}</button>`).join('');
            bar.querySelectorAll('button').forEach(b => b.onclick = () => {
                scope = b.dataset.scope;
                bar.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
                renderDashboard();
            });
        }

        function scopedGames() {
            return games.filter(g => scope === 'all' || g.season === scope)
                .sort((a, b) => a.season.localeCompare(b.season) || a.game - b.game);
        }

        function getFilteredData() {
            const d = scopedGames();
            return currentFilter === 'valid' ? d.filter(g => g.mp >= MIN_MP) : d;
        }

        function groupByPlayer(data) {
            const m = {};
            data.forEach(g => (m[g.player_id] = m[g.player_id] || []).push(g));
            return m;
        }

        function calculatePlayerStats(data) {
            return Object.entries(groupByPlayer(data)).map(([id, gs]) => {
                const valid = gs.filter(g => g.mp >= MIN_MP);
                const gp = valid.length;
                if (!gp) return null;
                const fga = sum(valid, 'fga');
                return {
                    id, name: fullName(id), gp, games: valid,
                    avgMp: r1(sum(valid, 'mp') / gp),
                    avgPts: r1(sum(valid, 'pts') / gp),
                    avgReb: r1(sum(valid, 'trb') / gp),
                    avgAst: r1(sum(valid, 'ast') / gp),
                    avgGameScore: r1(sum(valid, 'gameScore') / gp),
                    avgPtsPerFGA: fga ? Math.round(sum(valid, 'pts') / fga * 100) / 100 : 0
                };
            }).filter(Boolean);
        }

        function playerCell(id) {
            const photo = photoOf(id, scope === 'all' ? null : scope);
            const team = teamOf(id, scope === 'all' ? null : scope);
            return `<td><div class="player-cell">${photo ? `<img src="${photo}" alt="" class="player-photo">` : ''}
                <div><span class="player-name" onclick="showPlayerGameLog('${id}')">${fullName(id)}</span>
                <div class="player-team">${team}</div></div></div></td>`;
        }

        function tableHtml(headers, rows) {
            return `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>`;
        }

        function emptyRow(cols, msg) {
            return `<tr><td colspan="${cols}" class="empty">${msg}</td></tr>`;
        }

        function renderHero() {
            const pts = sum(games, 'pts');
            const ids = new Set(games.map(g => g.player_id));
            const tracked = roster.filter(p => p.active && p.seasons[SEASONS[SEASONS.length - 1]]).length;
            const schools = new Set(roster.flatMap(p => Object.values(p.seasons).map(s => s.team)));
            document.getElementById('hero').innerHTML = `
                <div class="big">${pts.toLocaleString()}</div>
                <div class="caption">Points scored by IMG grads since 2025</div>
                <div class="subs">
                    <div><b>${games.length}</b>Games</div>
                    <div><b>${ids.size}</b>Players with stats</div>
                    <div><b>${tracked}</b>Tracked this season</div>
                    <div><b>${schools.size}</b>Schools</div>
                </div>`;
        }

        function renderLeaderboard() {
            const label = scope === 'all' ? 'Career' : scope;
            document.getElementById('leaderTitle').textContent = `Top Scorers · ${label}`;
            const rows = Object.entries(groupByPlayer(scopedGames()))
                .map(([id, gs]) => ({ id, gp: gs.length, pts: sum(gs, 'pts') }))
                .sort((a, b) => b.pts - a.pts).slice(0, 10)
                .map((p, i) => `<tr><td class="rank">${i + 1}</td>${playerCell(p.id)}<td>${p.gp}</td><td><b>${p.pts}</b></td><td>${r1(p.pts / p.gp)}</td></tr>`);
            document.getElementById('leaderTable').innerHTML =
                tableHtml(['#', 'Player', 'GP', 'PTS', 'PPG'], rows.length ? rows : [emptyRow(5, 'No games yet for this season.')]);
        }

        function renderPlayerTable() {
            const table = document.getElementById('playerTable');
            const groups = Object.entries(groupByPlayer(getFilteredData().filter(g => g.mp >= MIN_MP)));
            if (currentView === 'totals') {
                const rows = groups.map(([id, gs]) => {
                    const fg = sum(gs, 'fg'), fga = sum(gs, 'fga');
                    return `<tr>${playerCell(id)}<td>${gs.length}</td>${['mp', 'pts', 'orb', 'drb', 'ast', 'stl', 'tov'].map(k => `<td>${sum(gs, k)}</td>`).join('')}
                        <td>${fga ? (fg / fga * 100).toFixed(1) + '%' : 'N/A'}</td><td>${fg}</td><td>${fga}</td></tr>`;
                });
                table.innerHTML = tableHtml(['Player', 'GP', 'MP', 'PTS', 'ORB', 'DRB', 'AST', 'STL', 'TOV', 'FG%', 'FG', 'FGA'],
                    rows.length ? rows : [emptyRow(12, 'No games yet.')]);
            } else {
                const rows = groups.map(([id, gs]) => {
                    const mp = sum(gs, 'mp');
                    return `<tr>${playerCell(id)}<td>${gs.length}</td>${['pts', 'trb', 'ast', 'stl', 'tov'].map(k => `<td>${(sum(gs, k) / mp * 40).toFixed(1)}</td>`).join('')}</tr>`;
                });
                table.innerHTML = tableHtml(['Player', 'GP', 'PTS', 'REB', 'AST', 'STL', 'TOV'],
                    rows.length ? rows : [emptyRow(7, 'No games yet.')]);
            }
        }

        function renderStatsCards(stats) {
            const grid = document.getElementById('statsGrid');
            if (!stats.length) { grid.innerHTML = ''; return; }
            const top = k => stats.reduce((m, p) => p[k] > m[k] ? p : m, stats[0]);
            const card = (title, p, k) => {
                const photo = photoOf(p.id, scope === 'all' ? null : scope);
                return `<div class="stat-card">${photo ? `<img src="${photo}" alt="" class="player-photo-small">` : ''}
                    <h3>${title}</h3><div class="value">${p[k]}</div><div class="label">${p.name}</div></div>`;
            };
            grid.innerHTML = card('Top Scorer', top('avgPts'), 'avgPts') + card('Most Efficient', top('avgPtsPerFGA'), 'avgPtsPerFGA')
                + card('Most Minutes', top('avgMp'), 'avgMp') + card('Top Impact', top('avgGameScore'), 'avgGameScore');
        }

        function renderRecentFormTable(data) {
            const trend = (recent, season) => {
                const diff = season ? (recent - season) / season * 100 : 0;
                if (diff > 10) return '<span class="trend-indicator trend-up">🔥 ↑ Hot</span>';
                if (diff < -10) return '<span class="trend-indicator trend-down">❄️ ↓ Cold</span>';
                return '<span class="trend-indicator trend-neutral">➡️ → Steady</span>';
            };
            const rows = Object.entries(groupByPlayer(data.filter(g => g.mp >= MIN_MP)))
                .filter(([, gs]) => gs.length >= 5)
                .map(([id, gs]) => {
                    const last5 = gs.slice(-5);
                    return `<tr>${playerCell(id)}${['pts', 'trb', 'ast'].map(k => {
                        const l = sum(last5, k) / 5, s = sum(gs, k) / gs.length;
                        return `<td>${l.toFixed(1)}</td><td>${s.toFixed(1)}</td><td>${trend(l, s)}</td>`;
                    }).join('')}</tr>`;
                });
            document.getElementById('recentFormTable').innerHTML = tableHtml(
                ['Player', 'Last 5 PPG', 'Season PPG', 'Trend', 'Last 5 RPG', 'Season RPG', 'Trend', 'Last 5 APG', 'Season APG', 'Trend'],
                rows.length ? rows : [emptyRow(10, 'Shows once a player has 5+ games.')]);
        }

        const baseLayout = { plot_bgcolor: 'white', paper_bgcolor: 'white', margin: { t: 20, r: 20, b: 60, l: 60 } };

        function renderScatterPlot(stats) {
            Plotly.newPlot('scatterPlot', [{
                x: stats.map(p => p.avgMp), y: stats.map(p => p.avgPtsPerFGA), text: stats.map(p => p.name),
                mode: 'markers+text', type: 'scatter', textposition: 'top center',
                textfont: { size: 11, color: '#2d3748' },
                marker: { size: stats.map(p => Math.max(10, p.avgGameScore * 2)), color: stats.map(p => p.avgGameScore),
                    colorscale: 'Viridis', showscale: true, colorbar: { title: 'GameScore' }, line: { color: 'white', width: 2 } },
                hovertemplate: '<b>%{text}</b><br>Minutes: %{x:.1f}<br>PTS/FGA: %{y:.2f}<extra></extra>'
            }], { ...baseLayout, height: 500, hovermode: 'closest',
                xaxis: { title: 'Average Minutes Per Game', gridcolor: '#e2e8f0' },
                yaxis: { title: 'Points Per Field Goal Attempt', gridcolor: '#e2e8f0' } }, { responsive: true });
        }

        function renderBarChart(stats) {
            const s = [...stats].sort((a, b) => b.avgPts - a.avgPts);
            const bar = (k, name, color) => ({ x: s.map(p => p.name), y: s.map(p => p[k]), name, type: 'bar', marker: { color } });
            Plotly.newPlot('barChart', [bar('avgPts', 'PPG', '#003da5'), bar('avgReb', 'RPG', '#0055d4'), bar('avgAst', 'APG', '#4a90e2')],
                { ...baseLayout, barmode: 'group', height: 400, margin: { t: 20, r: 20, b: 80, l: 60 },
                    yaxis: { title: 'Per Game Average' }, legend: { orientation: 'h', y: 1.1 } }, { responsive: true });
        }

        function renderLineChart(data) {
            const titles = { pts: 'Cumulative Points', trb: 'Cumulative Total Rebounds', ast: 'Cumulative Assists' };
            const traces = Object.entries(groupByPlayer(data.filter(g => g.mp >= MIN_MP))).map(([id, gs]) => {
                let c = 0;
                return { x: gs.map((g, i) => i + 1), y: gs.map(g => c += g[currentStat]), name: fullName(id), mode: 'lines+markers', type: 'scatter' };
            });
            Plotly.newPlot('lineChart', traces, { ...baseLayout, height: 400, hovermode: 'closest',
                xaxis: { title: 'Game Number' }, yaxis: { title: titles[currentStat] } }, { responsive: true });
        }

        function renderDashboard() {
            const data = getFilteredData();
            const stats = calculatePlayerStats(data);
            renderHero();
            renderLeaderboard();
            renderPlayerTable();
            renderStatsCards(stats);
            renderRecentFormTable(data);
            if (!window.Plotly) return;
            renderScatterPlot(stats);
            renderBarChart(stats);
            renderLineChart(data);
        }

        function showPlayerGameLog(id) {
            const season = scope === 'all' ? null : scope;
            const photo = photoOf(id, season);
            const img = document.getElementById('modalPlayerPhoto');
            img.src = photo;
            img.style.display = photo ? 'block' : 'none';
            document.getElementById('modalPlayerName').textContent = fullName(id);
            document.getElementById('modalPlayerTeam').textContent = teamOf(id, season);
            const career = scope === 'all';
            const rows = scopedGames().filter(g => g.player_id === id && g.mp >= MIN_MP).map((g, i) => `<tr>
                <td class="game-number">${i + 1}</td>${career ? `<td>${g.season}</td>` : ''}<td>${g.opp || 'N/A'}</td><td>${g.result || ''}</td>
                ${['mp', 'pts', 'orb', 'drb', 'trb', 'ast', 'stl', 'tov', 'fg', 'fga'].map(k => `<td>${g[k]}</td>`).join('')}
                <td>${g.fga ? (g.fgPct * 100).toFixed(1) + '%' : 'N/A'}</td><td>${g.gameScore.toFixed(1)}</td></tr>`);
            const headers = ['Game', ...(career ? ['Season'] : []), 'Opp', 'Result', 'MP', 'PTS', 'ORB', 'DRB', 'TRB', 'AST', 'STL', 'TOV', 'FG', 'FGA', 'FG%', 'GameScore'];
            document.getElementById('gameLogTable').innerHTML = tableHtml(headers, rows.length ? rows : [emptyRow(headers.length, 'No games yet.')]);
            document.getElementById('playerModal').style.display = 'block';
        }

        function closePlayerModal() {
            document.getElementById('playerModal').style.display = 'none';
        }

        window.onclick = e => { if (e.target.id === 'playerModal') closePlayerModal(); };

        document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b === btn));
            currentView = btn.dataset.view;
            renderPlayerTable();
        }));

        document.querySelectorAll('[data-stat]').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('[data-stat]').forEach(b => b.classList.toggle('active', b === btn));
            currentStat = btn.dataset.stat;
            if (window.Plotly) renderLineChart(getFilteredData());
        }));

        document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
            currentFilter = btn.dataset.filter;
            renderDashboard();
        }));

        loadData();
    </script>
</body>
</html>
