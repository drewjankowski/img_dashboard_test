<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMG Women's Basketball Graduates</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #003da5 0%, #002d7a 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .header { text-align: center; color: white; margin: 20px 0 30px; }
        .header h1 { font-size: 2.4em; font-weight: 800; letter-spacing: 1px; text-shadow: 3px 3px 6px rgba(0,0,0,0.5); }
        .header p { font-size: 1.1em; opacity: 0.85; margin-top: 6px; }

        .dashboard { background: white; border-radius: 20px; padding: 50px 30px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

        .rotator { text-align: center; min-height: 190px; }
        .rotator .big { font-size: 5.5em; font-weight: 800; color: #003da5; line-height: 1; font-variant-numeric: tabular-nums; }
        .rotator .caption { font-size: 1.25em; color: #4a5568; margin-top: 12px; font-weight: 600; }
        .rotator .stage { transition: opacity 0.4s ease; }
        .rotator .stage.fade { opacity: 0; }

        .dots { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
        .dots button { width: 10px; height: 10px; border-radius: 50%; border: none; background: #cbd5e0; cursor: pointer; padding: 0; transition: background 0.3s, transform 0.3s; }
        .dots button.active { background: #003da5; transform: scale(1.3); }

        .header .meta { display: flex; justify-content: center; gap: 30px; margin-top: 16px; font-size: 0.95em; opacity: 0.95; flex-wrap: wrap; }
        .header .meta b { font-size: 1.3em; font-weight: 800; margin-right: 4px; }

        .pills { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .pills button { padding: 8px 18px; border: 2px solid #003da5; background: white; color: #003da5; border-radius: 25px; cursor: pointer; font-weight: 600; font-family: inherit; }
        .pills button.active, .pills button:hover { background: #003da5; color: white; }
        .table-wrap { overflow-x: auto; }
        .stats-table { width: 100%; border-collapse: collapse; min-width: 720px; }
        .stats-table th { background: #003da5; color: white; padding: 12px 10px; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; text-align: center; }
        .stats-table th:first-child { text-align: left; border-radius: 10px 0 0 0; }
        .stats-table th:last-child { border-radius: 0 10px 0 0; }
        .stats-table th.sorted::after { content: ' ▾'; }
        .stats-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 0.92em; }
        .stats-table td:first-child { text-align: left; }
        .stats-table tr:hover td { background: #f7fafc; }
        .who { display: flex; align-items: center; gap: 12px; }
        .avatar.avatar-sm { width: 44px; height: 44px; border-width: 2px; font-size: 0.85em; margin: 0; flex-shrink: 0; }
        .who .avatar { width: 42px; height: 42px; border-width: 2px; font-size: 0.85em; margin: 0; flex-shrink: 0; }
        .who .nm { font-weight: 600; color: #2d3748; }
        .who .sc { font-size: 0.8em; color: #718096; }
        .empty { padding: 30px; text-align: center; color: #718096; }



        .rotator-row { display: flex; align-items: center; justify-content: center; gap: 30px; }
        .rotator-row .stage { flex: 1; max-width: 640px; }
        .arrow { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #003da5; background: white; color: #003da5; font-size: 1.4em; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .arrow:hover { background: #003da5; color: white; }

        .rotator { margin-bottom: 15px; }
        .section { margin-top: 20px; border: 1px solid #e2e8f0; border-radius: 15px; overflow: hidden; }
        .section-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; background: #f8f9fa; border: none; cursor: pointer; font-size: 1.3em; font-weight: 700; color: #2d3748; font-family: inherit; }
        .section-toggle:hover { background: #edf2f7; }
        .section-toggle .count { font-size: 0.7em; color: #718096; font-weight: 600; margin-left: 10px; }
        .section-toggle .chev { color: #003da5; transition: transform 0.3s; }
        .section.open > .section-toggle .chev { transform: rotate(180deg); }
        .section-body { display: none; padding: 25px; }
        .section.open > .section-body { display: block; }

        .class-group { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
        .class-group:last-child { margin-bottom: 0; }
        .class-group .section-toggle { font-size: 1.05em; padding: 15px 20px; background: white; }
        .class-group .section-body { padding: 20px; background: #fbfcfd; }
        .class-group.open > .section-toggle .chev { transform: rotate(180deg); }
        .class-group.open > .section-body { display: block; }

        .log-head { display: flex; align-items: center; gap: 14px; text-align: left; }
        .log-head .gp { font-size: 0.8em; color: #718096; font-weight: 600; }
        .game-table { width: 100%; border-collapse: collapse; min-width: 760px; background: white; }
        .game-table th { background: #edf2f7; color: #2d3748; padding: 10px 8px; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        .game-table td { padding: 9px 8px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 0.88em; }
        .game-table td.opp { text-align: left; white-space: nowrap; }
        .game-table .w { color: #2f855a; font-weight: 600; }
        .game-table .l { color: #c53030; font-weight: 600; }

        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
        .player-card { text-align: center; padding: 22px 15px; border-radius: 15px; background: #f8f9fa; }
        .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 4px solid #003da5; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; background: #003da5; color: white; font-size: 1.9em; font-weight: 800; }
        .player-card .name { font-weight: 700; color: #2d3748; font-size: 1.05em; }
        .player-card .pos { color: #4a5568; font-size: 0.85em; margin-top: 3px; }
        .player-card .school { color: #003da5; font-weight: 600; font-size: 0.9em; margin-top: 4px; }
        .player-card .class { color: #718096; font-size: 0.8em; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

        .loading, .error { text-align: center; padding: 60px; color: #003da5; font-size: 1.2em; }
        .error { color: #c33; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏀 IMG Women's Basketball Graduates</h1>
            <p>College Performance Analytics & Season Tracking</p>
            <div class="meta"><span><b id="games">0</b> Games Played</span><span><b id="tracked">0</b> Graduates Tracked</span></div>
        </div>

        <div class="dashboard">
            <div id="loading" class="loading">Loading data...</div>
            <div id="content" style="display:none;">
                <div class="rotator">
                    <div class="rotator-row">
                        <button class="arrow" id="prev" aria-label="Previous stat">‹</button>
                        <div class="stage" id="stage">
                            <div class="big" id="bigNum">0</div>
                            <div class="caption" id="bigCaption"></div>
                        </div>
                        <button class="arrow" id="next" aria-label="Next stat">›</button>
                    </div>
                    <div class="dots" id="dots"></div>
                </div>
                <div class="section" id="statsSection">
                    <button class="section-toggle"><span>Summary Stats</span><span class="chev">▾</span></button>
                    <div class="section-body">
                        <div class="pills" id="seasonPills"></div>
                        <div class="table-wrap"><table class="stats-table" id="statsTable"></table></div>
                    </div>
                </div>

                <div class="section" id="logsSection">
                    <button class="section-toggle"><span>Gamelogs</span><span class="chev">▾</span></button>
                    <div class="section-body">
                        <div class="pills" id="logPills"></div>
                        <div id="logList"></div>
                    </div>
                </div>

                <div class="section" id="playersSection">
                    <button class="section-toggle"><span>Meet the Graduates<span class="count" id="playerCount"></span></span><span class="chev">▾</span></button>
                    <div class="section-body" id="classList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SEASONS = ['2025-26', '2026-27'];
        const ROTATE_MS = 4000;
        const SINCE = '2025';
        const STATS = [
            { label: `Points scored by IMG grads since ${SINCE}`, value: g => g.pts },
            { label: `Assists dished since ${SINCE}`, value: g => g.ast },
            { label: `Rebounds grabbed since ${SINCE}`, value: g => g.orb + g.drb },
            { label: `Steals since ${SINCE}`, value: g => g.stl },
            { label: `Field goals made since ${SINCE}`, value: g => g.fg },
            { label: `Minutes played since ${SINCE}`, value: g => g.mp }
        ];

        const COLS = [
            ['GP', p => p.gp, 0], ['MPG', p => p.mp / p.gp, 1], ['PPG', p => p.pts / p.gp, 1],
            ['RPG', p => (p.orb + p.drb) / p.gp, 1], ['APG', p => p.ast / p.gp, 1], ['SPG', p => p.stl / p.gp, 1],
            ['TOV', p => p.tov / p.gp, 1], ['FG%', p => p.fga ? p.fg / p.fga * 100 : null, 1], ['PTS', p => p.pts, 0]
        ];

        let roster = [], games = [], current = 0, timer = null;
        let statScope = null, sortCol = 'GP', logScope = null;

        async function loadData() {
            try {
                roster = await (await fetch('data/roster.json')).json();
                const files = await Promise.all(SEASONS.map(s =>
                    fetch(`data/${s}.json`).then(r => r.ok ? r.json() : { games: [] }).catch(() => ({ games: [] }))));
                games = files.flatMap((f, i) => f.games.map(g => ({ ...g, season: SEASONS[i] })));
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                render();
            } catch (e) {
                console.error(e);
                const el = document.getElementById('loading');
                el.className = 'error';
                el.textContent = 'Unable to load the data files.';
            }
        }

        function countUp(el, target, ms = 900) {
            const start = performance.now();
            const step = now => {
                const t = Math.min(1, (now - start) / ms);
                el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3))).toLocaleString();
                if (t < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }

        function showStat(i) {
            current = i;
            const stage = document.getElementById('stage');
            stage.classList.add('fade');
            setTimeout(() => {
                const s = STATS[i];
                document.getElementById('bigCaption').textContent = s.label;
                countUp(document.getElementById('bigNum'), games.reduce((t, g) => t + s.value(g), 0));
                stage.classList.remove('fade');
            }, 400);
            document.querySelectorAll('#dots button').forEach((d, j) => d.classList.toggle('active', j === i));
        }

        function startRotation() {
            clearInterval(timer);
            timer = setInterval(() => showStat((current + 1) % STATS.length), ROTATE_MS);
        }

        function photoOf(p) {
            const k = [...SEASONS].reverse().find(x => p.seasons[x] && p.seasons[x].photo);
            return k ? p.seasons[k].photo : '';
        }

        function avatar(p, extra = '') {
            const cls = `avatar ${extra}`.trim();
            const initials = `<div class="${cls}">${p.first[0]}${p.last[0]}</div>`;
            const photo = photoOf(p);
            return photo ? `<img class="${cls}" src="${photo}" alt="${p.first} ${p.last}" onerror="this.outerHTML='${initials.replace(/"/g, '&quot;')}'">` : initials;
        }

        const POSITIONS = { G: 'Guard', F: 'Forward', C: 'Center' };
        const positionName = pos => pos.split('/').map(x => POSITIONS[x.trim()] || x).join(' / ');

        function renderPlayers(tracked, season) {
            document.getElementById('playerCount').textContent = `(${tracked.length})`;
            const classes = [...new Set(tracked.map(p => p.img_class))].sort();
            document.getElementById('classList').innerHTML = classes.map(c => {
                const list = tracked.filter(p => p.img_class === c).sort((a, b) => a.last.localeCompare(b.last));
                return `<div class="class-group">
                    <button class="section-toggle"><span>Class of ${c}<span class="count">(${list.length})</span></span><span class="chev">▾</span></button>
                    <div class="section-body"><div class="player-grid">${list.map(p => `
                        <div class="player-card">
                            ${avatar(p)}
                            <div class="name">${p.first} ${p.last}</div>
                            ${p.position ? `<div class="pos">${positionName(p.position)}</div>` : ''}
                            <div class="school">${p.seasons[season].team}</div>
                            <div class="class">Class of ${p.img_class}</div>
                        </div>`).join('')}</div></div>
                </div>`;
            }).join('');
        }

        function teamFor(p, season) {
            if (season) return p.seasons[season] ? p.seasons[season].team : '';
            const teams = [...SEASONS].reverse().filter(x => p.seasons[x]).map(x => p.seasons[x].team);
            return [...new Set(teams)].join(' · ');
        }

        function renderStats() {
            const rows = {};
            games.filter(g => statScope === 'all' || g.season === statScope).forEach(g => {
                const r = rows[g.player_id] = rows[g.player_id] || { gp: 0, mp: 0, pts: 0, orb: 0, drb: 0, ast: 0, stl: 0, tov: 0, fg: 0, fga: 0 };
                r.gp++;
                ['mp', 'pts', 'orb', 'drb', 'ast', 'stl', 'tov', 'fg', 'fga'].forEach(k => r[k] += g[k]);
            });
            const col = COLS.find(c => c[0] === sortCol);
            const list = Object.entries(rows).map(([id, r]) => ({ p: roster.find(x => x.id === id), r }))
                .sort((a, b) => (col[1](b.r) ?? -1) - (col[1](a.r) ?? -1));
            const head = `<thead><tr><th>Graduate</th>${COLS.map(c => `<th data-col="${c[0]}" class="${c[0] === sortCol ? 'sorted' : ''}">${c[0]}</th>`).join('')}</tr></thead>`;
            const body = list.length ? list.map(({ p, r }) => `<tr>
                <td><div class="who">${avatar(p)}<div><div class="nm">${p.first} ${p.last}</div><div class="sc">${teamFor(p, statScope === 'all' ? null : statScope)}</div></div></div></td>
                ${COLS.map(c => { const v = c[1](r); return `<td>${v === null ? '–' : v.toFixed(c[2])}</td>`; }).join('')}</tr>`).join('')
                : `<tr><td colspan="${COLS.length + 1}" class="empty">No games yet.</td></tr>`;
            const table = document.getElementById('statsTable');
            table.innerHTML = head + `<tbody>${body}</tbody>`;
            table.querySelectorAll('th[data-col]').forEach(th => th.onclick = () => { sortCol = th.dataset.col; renderStats(); });
        }

        function renderLogs() {
            const scoped = games.filter(g => logScope === 'all' || g.season === logScope)
                .sort((a, b) => a.season.localeCompare(b.season) || a.game - b.game);
            const byPlayer = {};
            scoped.forEach(g => (byPlayer[g.player_id] = byPlayer[g.player_id] || []).push(g));
            const career = logScope === 'all';
            const heads = ['#', ...(career ? ['Season'] : []), 'Opponent', 'Result', 'MIN', 'PTS', 'REB', 'AST', 'STL', 'TOV', 'FG', 'FG%', 'GmSc'];
            const list = Object.entries(byPlayer).map(([id, gs]) => ({ p: roster.find(x => x.id === id), gs }))
                .sort((a, b) => b.gs.length - a.gs.length || a.p.last.localeCompare(b.p.last));
            document.getElementById('logList').innerHTML = list.length ? list.map(({ p, gs }) => {
                const rows = gs.map((g, i) => {
                    const res = g.result || '';
                    const gmsc = g.pts + 1.4 * g.fg - g.fga + 0.7 * g.orb + 0.3 * g.drb + g.ast + g.stl - g.tov;
                    return `<tr><td>${i + 1}</td>${career ? `<td>${g.season}</td>` : ''}<td class="opp">${g.opp}</td>
                        <td class="${res.startsWith('W') ? 'w' : res.startsWith('L') ? 'l' : ''}">${res || '–'}</td>
                        <td>${g.mp}</td><td><b>${g.pts}</b></td><td>${g.orb + g.drb}</td><td>${g.ast}</td><td>${g.stl}</td><td>${g.tov}</td>
                        <td>${g.fg}-${g.fga}</td><td>${g.fga ? (g.fg / g.fga * 100).toFixed(1) : '–'}</td><td>${gmsc.toFixed(1)}</td></tr>`;
                }).join('');
                return `<div class="class-group">
                    <button class="section-toggle"><span class="log-head">${avatar(p, 'avatar-sm')}
                        <span><span>${p.first} ${p.last}</span><br><span class="gp">${teamFor(p, career ? null : logScope)} — ${gs.length} game${gs.length === 1 ? '' : 's'}</span></span></span><span class="chev">▾</span></button>
                    <div class="section-body"><div class="table-wrap"><table class="game-table">
                        <thead><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>
                </div>`;
            }).join('') : '<div class="empty">No games yet.</div>';
            bindToggles(document.getElementById('logList'));
        }

        function renderLogPills() {
            const opts = [...[...SEASONS].reverse().map(s => [s, s]), ['all', 'Career']];
            const el = document.getElementById('logPills');
            el.innerHTML = opts.map(([v, l]) => `<button data-v="${v}" class="${v === logScope ? 'active' : ''}">${l}</button>`).join('');
            el.querySelectorAll('button').forEach(b => b.onclick = () => { logScope = b.dataset.v; renderLogPills(); renderLogs(); });
        }

        function bindToggles(root) {
            root.querySelectorAll('.section-toggle').forEach(t => t.onclick = () => t.parentElement.classList.toggle('open'));
        }

        function renderSeasonPills() {
            const opts = [...[...SEASONS].reverse().map(s => [s, s]), ['all', 'Career']];
            const el = document.getElementById('seasonPills');
            el.innerHTML = opts.map(([v, l]) => `<button data-v="${v}" class="${v === statScope ? 'active' : ''}">${l}</button>`).join('');
            el.querySelectorAll('button').forEach(b => b.onclick = () => { statScope = b.dataset.v; renderSeasonPills(); renderStats(); });
        }

        function render() {
            const latest = SEASONS[SEASONS.length - 1];
            const tracked = roster.filter(p => p.active && p.seasons[latest]);

            countUp(document.getElementById('games'), games.length);
            countUp(document.getElementById('tracked'), tracked.length);

            document.getElementById('dots').innerHTML = STATS.map((s, i) => `<button aria-label="${s.label}"></button>`).join('');
            document.querySelectorAll('#dots button').forEach((d, i) => d.onclick = () => { showStat(i); startRotation(); });

            document.getElementById('prev').onclick = () => { showStat((current - 1 + STATS.length) % STATS.length); startRotation(); };
            document.getElementById('next').onclick = () => { showStat((current + 1) % STATS.length); startRotation(); };

            statScope = [...SEASONS].reverse().find(x => games.some(g => g.season === x)) || latest;
            renderSeasonPills();
            renderStats();
            renderPlayers(tracked, latest);
            bindToggles(document);
            logScope = statScope;
            renderLogPills();
            renderLogs();
            showStat(0);
            startRotation();
        }

        loadData();
    </script>
</body>
</html>
